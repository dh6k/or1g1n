name: CI
on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron uses UTC. Avoid minute 0 because scheduled runs are more likely to be delayed under load.
    # 03:17-06:17 UTC = 10:17-13:17 Vietnam time.
    - cron: "17 3-6 * * *"

jobs:
  check:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Should build?
        id: should_build
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git checkout origin/update build.md; then
            echo "first time building!"
            echo "SHOULD_BUILD=1" >> "$GITHUB_OUTPUT"
            echo "BRAVE_VERSION=" >> "$GITHUB_OUTPUT"
            echo "BRAVE_BETA_VERSION=" >> "$GITHUB_OUTPUT"
          else
            UPDATE_CFG=$(./build.sh config.toml --config-update)

            get_built_version() {
              local table=$1 line
              line=$(grep -F -m1 "$table: " build.md || :)
              line=${line#"$table: "}
              echo "${line%%[[:space:]]*}"
            }

            BUILT_BRAVE=$(get_built_version Brave)
            BUILT_BRAVE_BETA=$(get_built_version Brave-Beta)
            LATEST_BRAVE=$(./scripts/resolve-brave-release.sh release-android)
            LATEST_BRAVE_BETA=$(./scripts/resolve-brave-release.sh beta-android)

            echo "Brave: built=${BUILT_BRAVE:-none} detected=$LATEST_BRAVE"
            echo "Brave-Beta: built=${BUILT_BRAVE_BETA:-none} detected=$LATEST_BRAVE_BETA"

            BRAVE_VERSION=""
            BRAVE_BETA_VERSION=""
            if [ "$LATEST_BRAVE" != "$BUILT_BRAVE" ]; then
              BRAVE_VERSION=$LATEST_BRAVE
            fi
            if [ "$LATEST_BRAVE_BETA" != "$BUILT_BRAVE_BETA" ]; then
              BRAVE_BETA_VERSION=$LATEST_BRAVE_BETA
            fi

            if [ -n "$UPDATE_CFG" ] || [ -n "$BRAVE_VERSION" ] || [ -n "$BRAVE_BETA_VERSION" ]; then
              [ -n "$UPDATE_CFG" ] && echo "'$UPDATE_CFG'"
              echo "SHOULD_BUILD=1" >> "$GITHUB_OUTPUT"
            else
              echo "SHOULD_BUILD=0" >> "$GITHUB_OUTPUT"
            fi
            echo "BRAVE_VERSION=$BRAVE_VERSION" >> "$GITHUB_OUTPUT"
            echo "BRAVE_BETA_VERSION=$BRAVE_BETA_VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Clear older runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list -L400 --json databaseId -q '.[].databaseId' | tail -n+10 | xargs -IID gh api "repos/$GITHUB_REPOSITORY/actions/runs/ID" -X DELETE || :

    outputs:
      SHOULD_BUILD: ${{ steps.should_build.outputs.SHOULD_BUILD }}
      BRAVE_VERSION: ${{ steps.should_build.outputs.BRAVE_VERSION }}
      BRAVE_BETA_VERSION: ${{ steps.should_build.outputs.BRAVE_BETA_VERSION }}

  build:
    permissions: write-all
    needs: check
    uses: ./.github/workflows/build.yml
    if: ${{ needs.check.outputs.SHOULD_BUILD == '1' }}
    with:
      brave_version: ${{ needs.check.outputs.BRAVE_VERSION }}
      brave_beta_version: ${{ needs.check.outputs.BRAVE_BETA_VERSION }}
    secrets: inherit
